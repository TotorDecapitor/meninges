<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dans l'ordre · Méninges</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Méninges">
<link rel="apple-touch-icon" href="../../icones/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../icones/favicon-32.png">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../commun/style.css">
<style>
  :root { --exo: #2f8f52; }

  /* En-tête du jeu : nombre à trouver à gauche, chrono à droite */
  .tete { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .cible { display: flex; align-items: baseline; gap: 10px; color: var(--muted); font-weight: 600; }
  .cible b { font: 800 2.6rem/1 var(--f-display); color: var(--exo); min-width: 2ch; font-variant-numeric: tabular-nums; }
  .temps { position: relative; font: 800 1.6rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
  .penalite {
    position: absolute; right: 0; bottom: calc(100% + 4px); white-space: nowrap;
    font: 700 1rem var(--f-body); color: var(--faux); animation: monte .8s ease-out forwards;
  }
  @keyframes monte { from { transform: translateY(6px); opacity: 1; } to { transform: translateY(-10px); opacity: 0; } }

  /* Grille 5 × 5 : toute la largeur, cases carrées, limitée en hauteur pour ne jamais défiler */
  .grille {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px;
    width: min(100%, calc(100svh - 230px)); margin: 0 auto; aspect-ratio: 1;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .case {
    min-width: 44px; min-height: 44px; aspect-ratio: 1; border: 0; border-radius: 12px; padding: 0;
    background: var(--key); color: var(--ink); cursor: pointer; touch-action: none;
    font: 800 clamp(1.4rem, 7.5vw, 2.3rem)/1 var(--f-display); font-variant-numeric: tabular-nums;
    transition: background-color .15s, color .15s;
  }
  /* Case trouvée : elle se vide (simple contour), la grille reste en place */
  .case.trouvee { background: transparent; color: transparent; box-shadow: inset 0 0 0 2px var(--key); cursor: default; }
  .case.faux { background: var(--faux); color: var(--on-color); }
  .case:focus:not(:focus-visible) { outline: none; }
</style>
</head>
<body>
<div class="app">
  <div class="barre">
    <a class="retour" href="../../../">← Méninges</a>
    <h1><span>Dans l'ordre</span></h1>
  </div>

  <section class="ecran" id="intro">
    <h2>Dans l'ordre</h2>
    <p>Touche les nombres de 1 à 25 dans l'ordre, le plus vite possible. Chaque erreur ajoute 1 seconde à ton temps.</p>
    <p id="record-intro"></p>
    <div class="actions"><button class="btn principal" id="b-commencer" type="button">Commencer</button></div>
  </section>

  <section class="ecran" id="decompte" hidden><div class="compte" id="compte"></div></section>

  <section class="ecran" id="jeu" hidden>
    <div class="tete">
      <div class="cible"><span>Cherche le</span><b id="prochain" aria-live="polite">1</b></div>
      <div class="temps"><span class="penalite" id="penalite" hidden>+1 s</span><span id="chrono">0,0 s</span></div>
    </div>
    <div class="progression"><i id="barre"></i></div>
    <div class="grille" id="grille"></div>
  </section>

  <section class="ecran" id="resultat" hidden>
    <h2 id="titre-resultat">Terminé !</h2>
    <div class="score" id="score"></div>
    <div><span class="record" id="badge-record" hidden>Nouveau record</span></div>
    <p class="detail" id="detail"></p>
    <div class="actions">
      <button class="btn principal" id="b-rejouer" type="button">Rejouer</button>
      <a class="btn" href="../../../" style="text-align:center;text-decoration:none">Autres exercices</a>
    </div>
  </section>
</div>

<script src="../../commun/commun.js"></script>
<script src="logique.js"></script>
<script>
const SLUG = "ordre-nombres";
const M = Meninges;
const L = OrdreNombres;
const $ = id => document.getElementById(id);

let partie = null;
let anim = 0;
let enCours = false;
const cases = new Map(); // nombre -> bouton

function afficherRecord() {
  const r = M.meilleur(SLUG);
  $("record-intro").textContent = r === null ? "Pas encore de record." : "Ton record : " + M.formatScore(SLUG, r);
}

function commencer() {
  if (enCours) return;
  enCours = true;
  M.montrer("decompte");
  M.compteARebours($("compte"), demarrerJeu);
}

function demarrerJeu() {
  const grille = $("grille");
  grille.textContent = "";
  cases.clear();
  partie = L.creerPartie(M.melanger, M.maintenant());
  partie.grille.forEach(n => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "case"; b.textContent = n; b.dataset.n = n;
    cases.set(n, b);
    grille.appendChild(b);
  });
  $("prochain").textContent = "1";
  $("barre").style.width = "0%";
  $("penalite").hidden = true;
  M.montrer("jeu");
  partie.debut = M.maintenant(); // le chrono part quand la grille est visible
  tic();
}

function tic() {
  $("chrono").textContent = M.formatTemps(L.tempsTotal(partie, M.maintenant())) + " s";
  if (partie.fin === null) anim = requestAnimationFrame(tic);
}

function jouer(n) {
  if (!partie || partie.fin !== null) return;
  const b = cases.get(n);
  const res = L.toucher(partie, n, M.maintenant());
  if (res === "ignore") return;
  if (res === "faux") {
    b.classList.remove("faux", "flash-faux");
    void b.offsetWidth; // relance l'animation si on retouche la même case
    b.classList.add("faux", "flash-faux");
    clearTimeout(b._t);
    b._t = setTimeout(() => b.classList.remove("faux", "flash-faux"), 350);
    const p = $("penalite");
    p.hidden = true; void p.offsetWidth; p.hidden = false;
    clearTimeout(p._t);
    p._t = setTimeout(() => { p.hidden = true; }, 800);
    M.vibrer(40);
    return;
  }
  b.classList.remove("faux", "flash-faux");
  b.classList.add("trouvee");
  b.setAttribute("aria-disabled", "true");
  $("barre").style.width = ((partie.prochain - 1) / L.TAILLE * 100) + "%";
  if (res === "fin") { finir(); return; }
  $("prochain").textContent = partie.prochain;
}

function finir() {
  cancelAnimationFrame(anim);
  $("prochain").textContent = "✓";
  tic(); // affiche le temps final exact
  setTimeout(terminer, 350);
}

function terminer() {
  const brut = L.tempsBrut(partie), pen = L.penalites(partie), score = L.tempsTotal(partie);
  const r = M.enregistrer(SLUG, score);
  $("score").innerHTML = M.echap(M.formatScore(SLUG, score));
  $("badge-record").hidden = !r.record;
  $("titre-resultat").textContent = r.record ? "Plus rapide que jamais !" : (partie.erreurs === 0 ? "Sans faute !" : "Terminé !");
  const e = partie.erreurs;
  let detail = "Temps de recherche : " + M.formatTemps(brut) + " s. ";
  detail += e === 0 ? "Aucune erreur, donc aucune pénalité."
    : e + (e > 1 ? " erreurs" : " erreur") + ", soit +" + (pen / 1000) + " s de pénalité.";
  if (!r.record && !r.premier) detail += " Ton record : " + M.formatScore(SLUG, r.meilleur) + ".";
  $("detail").textContent = detail;
  enCours = false;
  M.montrer("resultat");
  afficherRecord();
}

// Réaction dès l'appui (pointerdown) pour que ce soit vif au doigt.
const grille = $("grille");
grille.addEventListener("pointerdown", e => {
  const b = e.target.closest(".case");
  if (!b || (e.pointerType === "mouse" && e.button !== 0)) return;
  e.preventDefault(); // pas de focus, de sélection ni de clic simulé
  jouer(Number(b.dataset.n));
});
// Clavier seulement (Entrée / Espace) : un clic venant d'un pointeur a detail > 0 et est ignoré.
grille.addEventListener("click", e => {
  const b = e.target.closest(".case");
  if (b && e.detail === 0) jouer(Number(b.dataset.n));
});
grille.addEventListener("contextmenu", e => e.preventDefault());

$("b-commencer").onclick = commencer;
$("b-rejouer").onclick = commencer;
afficherRecord();
</script>
</body>
</html>
