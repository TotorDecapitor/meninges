<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOM DE L'EXERCICE · Méninges</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Méninges">
<link rel="apple-touch-icon" href="../../icones/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../icones/favicon-32.png">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../commun/style.css">
<style>
  /* Couleur propre à l'exercice : reprendre celle du catalogue (commun/commun.js) */
  :root { --exo: #2c5bd6; }
  /* Styles spécifiques à l'exercice ici */
</style>
</head>
<body>
<div class="app">
  <div class="barre">
    <a class="retour" href="../../../">← Méninges</a>
    <h1><span>NOM</span></h1>
  </div>

  <!-- 1. Intro : règle en 1 ou 2 phrases, record actuel, bouton Commencer -->
  <section class="ecran" id="intro">
    <h2>Titre de l'exercice</h2>
    <p>Règle en une ou deux phrases.</p>
    <p id="record-intro"></p>
    <div class="actions"><button class="btn principal" id="b-commencer" type="button">Commencer</button></div>
  </section>

  <!-- 2. Compte à rebours -->
  <section class="ecran" id="decompte" hidden><div class="compte" id="compte"></div></section>

  <!-- 3. Jeu -->
  <section class="ecran" id="jeu" hidden>
    <div class="info"><span id="etape">1 / 20</span><span id="chrono">0,0 s</span></div>
    <div class="progression"><i id="barre"></i></div>
    <!-- contenu du jeu -->
  </section>

  <!-- 4. Résultat : score, badge record, détail, Rejouer / Retour -->
  <section class="ecran" id="resultat" hidden>
    <h2 id="titre-resultat">Terminé !</h2>
    <div class="score" id="score"></div>
    <div><span class="record" id="badge-record" hidden>Nouveau record</span></div>
    <p class="detail" id="detail"></p>
    <div class="actions">
      <button class="btn principal" id="b-rejouer" type="button">Rejouer</button>
      <a class="btn" href="../../../" style="text-align:center;text-decoration:none">Autres exercices</a>
    </div>
  </section>
</div>

<script src="../../commun/commun.js"></script>
<script>
const SLUG = "calcul-eclair"; // slug du catalogue
const M = Meninges;

function afficherRecord() {
  const r = M.meilleur(SLUG);
  document.getElementById("record-intro").textContent = r === null ? "Pas encore de record." : "Ton record : " + M.formatScore(SLUG, r);
}

function commencer() {
  M.montrer("decompte");
  M.compteARebours(document.getElementById("compte"), demarrerJeu);
}

function demarrerJeu() {
  M.montrer("jeu");
  // ... logique du jeu ...
}

function terminer(score, detail) {
  const r = M.enregistrer(SLUG, score);
  document.getElementById("score").innerHTML = M.echap(M.formatScore(SLUG, score));
  document.getElementById("badge-record").hidden = !r.record;
  document.getElementById("detail").textContent = detail;
  M.montrer("resultat");
}

document.getElementById("b-commencer").onclick = commencer;
document.getElementById("b-rejouer").onclick = commencer;
afficherRecord();
</script>
</body>
</html>
